<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fred the Painter Game</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f0f0; }
        .container { text-align: center; padding: 50px; }
        .canvas { border: 1px solid #000; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Fred the Painter's Fun Game!</h1>
        <p>Help Fred paint the canvas by clicking on the canvas!</p>
        <canvas class="canvas" id="paintingCanvas" width="400" height="400"></canvas>
        <br>
        <button id="resetButton">Reset Canvas</button>
    </div>
    <script>
        const canvas = document.getElementById('paintingCanvas');
        const ctx = canvas.getContext('2d');
        let painting = false;

        function startPosition(e) {
            painting = true;
            draw(e);
        }

        function endPosition() {
            painting = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!painting) return;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'blue';

            ctx.lineTo(e.clientX - canvas.offsetLeft, e.clientY - canvas.offsetTop);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(e.clientX - canvas.offsetLeft, e.clientY - canvas.offsetTop);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);

        document.getElementById('resetButton').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });
    </script>
</body>
</html>
